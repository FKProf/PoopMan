name: Release

# Compila il gioco su Windows e pubblica una GitHub Release.
# Si avvia al push di un tag "PoopMan_vX.Y.Z" (es. PoopMan_v1.2.0).
# Le note di rilascio vengono lette da .github/release-notes/<tag>.md se presente.

on:
  push:
    tags:
      - "PoopMan_v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag esistente da pubblicare (es. PoopMan_v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Compute version
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^PoopMan_v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $notes = ".github/release-notes/$($env:TAG).md"
          if (-not (Test-Path $notes)) { "Release $($env:TAG)" | Out-File -FilePath $notes -Encoding utf8 }
          "NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Clean content pipeline cache
        shell: pwsh
        run: |
          # La cache MGCB committata nel repo potrebbe far saltare la compilazione degli asset
          Remove-Item PoopMan/Content/obj, PoopMan/Content/bin -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build (Release, include content pipeline)
        run: dotnet build PoopMan/PoopMan.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          $out = "PoopMan/bin/Release/net9.0-windows"
          # Nessun salvataggio locale nel pacchetto: ogni giocatore parte con la classifica pulita
          Remove-Item "$out/leaderboard.json" -ErrorAction SilentlyContinue
          if (-not (Test-Path "$out/PoopMan.exe")) { throw "PoopMan.exe non trovato in $out" }
          foreach ($f in "Content/font/Score.xnb", "Content/image/Tile/terrain.xnb", "Content/image/Tile/TilesetAtlas.xml",
                         "Content/image/items/items.xml", "Content/Audio/BMG/hope.xnb", "Content/Audio/UISounds/UISound.xnb") {
            if (-not (Test-Path "$out/$f")) { throw "Asset mancante nel pacchetto: $f" }
          }
          Compress-Archive -Path "$out/*" -DestinationPath "PoopMan.v$($env:VERSION).zip"
          Get-Item "PoopMan.v$($env:VERSION).zip" | Format-List Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PoopMan v${{ env.VERSION }}
          body_path: ${{ env.NOTES }}
          files: PoopMan.v${{ env.VERSION }}.zip
