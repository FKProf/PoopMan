name: Windows auto-play

# Avvia e gioca PoopMan su Windows (DirectX) per verificare che tutto funzioni:
#  1. build Release del gioco, identica a quella della release;
#  2. smoke test del vero PoopMan.exe pilotato con tasti reali + screenshot;
#  3. auto-play accelerato (bot) con controlli: eccezioni, pipistrelli nei muri,
#     porta/chiave raggiungibili, detonatore, schermate UI e tutti i biomi.
# Screenshot e log finiscono negli artifact del run.

on:
  push:
    branches: [ 'claude/**' ]
    paths:
      - 'PoopMan/**'
      - 'PoopManLibrary/**'
      - 'tests/**'
      - '.github/workflows/windows-autoplay.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autoplay:
    # Le PR dai branch claude/** sono già coperte dal trigger push
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build PoopMan (Release, content pipeline incluso)
        run: |
          Remove-Item -Recurse -Force PoopMan/Content/obj, PoopMan/Content/bin -ErrorAction SilentlyContinue
          dotnet build PoopMan/PoopMan.csproj -c Release

      - name: Smoke test del vero PoopMan.exe (tasti reali)
        run: |
          $game = (Resolve-Path PoopMan/bin/Release/net9.0-windows).Path
          ./tests/windows-smoke.ps1 -GameDir $game -OutDir out/smoke -PlaySeconds 120

      - name: Build auto-play
        run: |
          dotnet build tests/PoopMan.AutoPlay/PoopMan.AutoPlay.csproj -c Release
          $dst = 'tests/PoopMan.AutoPlay/bin/Release/net9.0-windows'
          Copy-Item -Recurse -Force PoopMan/bin/Release/net9.0-windows/Content "$dst/Content"

      - name: Auto-play (bot)
        run: |
          $dir = (Resolve-Path tests/PoopMan.AutoPlay/bin/Release/net9.0-windows).Path
          $exe = Join-Path $dir 'PoopMan.AutoPlay.exe'
          $out = (New-Item -ItemType Directory -Force out).FullName

          function Run-Mode($name, $argList, $timeoutSec) {
            $log = Join-Path $out "$name.log"
            $p = Start-Process -FilePath $exe -ArgumentList $argList -WorkingDirectory $dir -PassThru `
                   -RedirectStandardOutput $log -RedirectStandardError "$log.err" -NoNewWindow
            return @{ Name = $name; Proc = $p; Log = $log; Timeout = $timeoutSec }
          }

          # Scenari brevi in sequenza
          $scenarios = @(
            @('det',    "30 1 `"$out\det`" 999 det",       120, 1),
            @('knock',  "120 8 `"$out\knock`" 999 knock", 600, 1),
            @('knock2', "120 6 `"$out\knock2`" 999 knock", 600, 7),
            @('ui',     "90 1 `"$out\ui`" 999 ui",         300, 1),
            @('biomes', "60 1 `"$out\biomes`" 999 biomes", 300, 1)
          )
          $runs = @()
          foreach ($s in $scenarios) {
            $env:AUTOPLAY_SEED = $s[3]
            $r = Run-Mode $s[0] $s[1] $s[2]
            if (-not $r.Proc.WaitForExit($r.Timeout * 1000)) { $r.Proc.Kill(); Add-Content $r.Log "TIMEOUT" }
            $runs += $r
          }

          # Partite lunghe in parallelo
          $env:AUTOPLAY_SEED = '1234'
          $long = @(
            (Run-Mode 'bot'     "600 10 `"$out\bot`" 20 bot"        1500),
            (Run-Mode 'deep'    "600 10 `"$out\deep`" 7 deep"       1500),
            (Run-Mode 'deepall' "400 10 `"$out\deepall`" 9 deepall" 1500)
          )
          foreach ($r in $long) {
            if (-not $r.Proc.WaitForExit($r.Timeout * 1000)) { $r.Proc.Kill(); Add-Content $r.Log "TIMEOUT" }
          }
          $runs += $long

          # Esito
          $failed = $false
          $summary = @("## PoopMan — auto-play su Windows", "", "| Modalità | Exit | Esito | Dettagli |", "|---|---|---|---|")
          foreach ($r in $runs) {
            $r.Proc.WaitForExit()
            $text = (Get-Content $r.Log -Raw -ErrorAction SilentlyContinue) + (Get-Content "$($r.Log).err" -Raw -ErrorAction SilentlyContinue)
            $problems = @()
            if ($r.Proc.ExitCode -ne 0) { $problems += "exit $($r.Proc.ExitCode)" }
            if ($text -match 'EXCEPTION|Unhandled exception') { $problems += 'eccezione' }
            if ($text -match '\[INV\]') { $problems += 'invarianti violate' }
            if ($text -match 'FAIL') { $problems += 'FAIL' }
            if ($text -match 'TIMEOUT') { $problems += 'timeout' }
            $detail = ($text -split "`n" | Where-Object { $_ -match '^(DONE|\[DET\]|\[KNOCK\]|AUTOPLAY)' } | Select-Object -Last 3) -join ' / '
            $ok = $problems.Count -eq 0
            if (-not $ok) { $failed = $true }
            $summary += "| $($r.Name) | $($r.Proc.ExitCode) | $(if ($ok) {'✅'} else {'❌ ' + ($problems -join ', ')}) | $($detail.Trim() -replace '\|','/') |"
            Write-Host "===== $($r.Name) (exit $($r.Proc.ExitCode)) ====="
            Write-Host (($text -split "`n" | Where-Object { $_ -notmatch '^\[DBG\]' } | Select-Object -Last 25) -join "`n")
          }
          $summary -join "`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($failed) { Write-Host "::error::auto-play: problemi rilevati"; exit 1 }
          Write-Host "AUTOPLAY PASS"

      - name: Controllo screenshot + anteprima nel log
        if: always()
        run: |
          Add-Type -AssemblyName System.Drawing
          # 1) Ogni screenshot deve avere contenuto (niente schermo nero/uniforme)
          $bad = 0
          Get-ChildItem out -Recurse -Filter *.png | Sort-Object FullName | ForEach-Object {
            $bmp = [System.Drawing.Bitmap]::FromFile($_.FullName)
            $n = 0; $sum = 0.0; $sq = 0.0
            for ($y = 0; $y -lt $bmp.Height; $y += 8) {
              for ($x = 0; $x -lt $bmp.Width; $x += 8) {
                $c = $bmp.GetPixel($x, $y)
                $l = 0.299 * $c.R + 0.587 * $c.G + 0.114 * $c.B
                $sum += $l; $sq += $l * $l; $n++
              }
            }
            $mean = $sum / $n; $std = [Math]::Sqrt([Math]::Max(0, $sq / $n - $mean * $mean))
            $flag = if ($std -lt 4) { $bad++; 'VUOTO?' } else { 'ok' }
            Write-Host ("SHOTSTAT {0,-40} {1}x{2} luminosita={3,6:N1} contrasto={4,6:N1} {5}" -f `
              ($_.FullName.Substring((Resolve-Path out).Path.Length + 1)), $bmp.Width, $bmp.Height, $mean, $std, $flag)
            $bmp.Dispose()
          }
          # 2) Foglio di anteprima (JPEG piccolo in base64) per chi non può scaricare l'artifact
          $pick = @('smoke/00_title.png', 'smoke/02_partita.png', 'smoke/05_gioco_040s.png', 'smoke/07_pausa.png',
                    'biomes/biome2_boom.png', 'biomes/biome3_boom.png') | Where-Object { Test-Path "out/$_" }
          if ($pick.Count -gt 0) {
            $tw = 400; $th = 250; $cols = 2; $rows = [Math]::Ceiling($pick.Count / $cols)
            $sheet = New-Object System.Drawing.Bitmap ($tw * $cols), ($th * $rows)
            $g = [System.Drawing.Graphics]::FromImage($sheet)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            for ($i = 0; $i -lt $pick.Count; $i++) {
              $img = [System.Drawing.Image]::FromFile((Resolve-Path "out/$($pick[$i])").Path)
              $g.DrawImage($img, ($i % $cols) * $tw, [Math]::Floor($i / $cols) * $th, $tw, $th)
              $img.Dispose()
            }
            $g.Dispose()
            $enc = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
            $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
            $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 55L
            $ms = New-Object System.IO.MemoryStream
            $sheet.Save($ms, $enc, $ep); $sheet.Dispose()
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            Write-Host "PREVIEW order: $($pick -join ', ')"
            Write-Host "PREVIEW-BEGIN"
            for ($i = 0; $i -lt $b64.Length; $i += 2000) { Write-Host ("PV " + $b64.Substring($i, [Math]::Min(2000, $b64.Length - $i))) }
            Write-Host "PREVIEW-END"
          }
          if ($bad -gt 0) { Write-Host "::error::$bad screenshot sembrano vuoti"; exit 1 }

      - name: Carica screenshot e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poopman-windows-autoplay
          path: out/
          retention-days: 14
